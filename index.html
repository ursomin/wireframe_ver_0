<!doctype html>
<html lang="ko">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        PLAYUPP
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <a
            class="brand"
            href="index.html"
        >
            <span class="brand-mark">
                PLAY<span>UPP</span>
            </span>
        </a>

        <nav class="main-nav">

            <a href="index.html">
                모임 찾기
            </a>

            <a href="create.html">
                모임 생성
            </a>

            <a href="my-meetings.html">
                내 모임
            </a>

        </nav>

        <div class="top-actions">

            <a href="chat.html">
                채팅
            </a>

            <a href="profile.html">
                내 프로필
            </a>

        </div>

    </div>

</header>


<main class="page-width">

    <div class="page-head">

        <div>

            <h1>
                모임 찾기
            </h1>

            <p>
                원하는 조건으로 운동 모임을 찾아보세요.
            </p>

        </div>


        <a
            href="create.html"
            class="btn blue"
        >
            + 모임 만들기
        </a>

    </div>


    <section
        class="panel"
        style="margin-bottom:20px"
    >

        <h2>
            검색 및 필터
        </h2>


        <div
            class="form-grid"
            style="margin-top:16px"
        >

            <div class="field">

                <label for="keywordInput">
                    검색어
                </label>

                <input
                    id="keywordInput"
                    type="text"
                    placeholder="제목 또는 설명"
                >

            </div>


            <div class="field">

                <label for="sportFilter">
                    운동 종목
                </label>

                <select id="sportFilter">

                    <option value="">
                        전체 종목
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="dateFilter">
                    날짜
                </label>

                <input
                    id="dateFilter"
                    type="date"
                >

            </div>


            <div class="field">

                <label for="locationFilter">
                    지역
                </label>

                <input
                    id="locationFilter"
                    type="text"
                    placeholder="예: 인천, 강남"
                >

            </div>


            <div class="field">

                <label for="statusFilter">
                    모집 상태
                </label>

                <select id="statusFilter">

                    <option value="">
                        전체 상태
                    </option>

                    <option value="RECRUITING">
                        모집 중
                    </option>

                    <option value="CLOSED">
                        모집 마감
                    </option>

                    <option value="COMPLETED">
                        모임 완료
                    </option>

                    <option value="CANCELED">
                        모임 취소
                    </option>

                </select>

            </div>

        </div>


        <div
            style="
                display:flex;
                gap:10px;
                margin-top:18px;
            "
        >

            <button
                id="searchButton"
                class="btn blue"
                type="button"
            >
                검색
            </button>

            <button
                id="resetButton"
                class="btn"
                type="button"
            >
                초기화
            </button>

        </div>

    </section>


    <div
        id="meetingCount"
        class="subtle"
        style="margin-bottom:12px"
    >
    </div>


    <section>

        <div
            id="meetingsList"
            style="
                display:grid;
                grid-template-columns:
                    repeat(
                        auto-fit,
                        minmax(260px, 1fr)
                    );
                gap:16px;
            "
        >

            <div class="panel">
                모임 정보를 불러오는 중...
            </div>

        </div>

    </section>

</main>


<div
    id="toast"
    class="toast"
></div>


<script src="meetings-api.js"></script>

</body>

</html>
