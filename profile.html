<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        프로필 | PLAYUPP
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <a
            class="brand"
            href="index.html"
        >
            <span class="brand-mark">
                PLAY<span>UPP</span>
            </span>
        </a>

        <nav class="main-nav">

            <a href="index.html">
                모임 찾기
            </a>

            <a href="create.html">
                모임 생성
            </a>

            <a href="my-meetings.html">
                내 모임
            </a>

        </nav>

        <div class="top-actions">

            <a href="chat.html">
                채팅
            </a>

            <a href="profile.html">

                <span
                    id="headerAvatar"
                    class="avatar"
                >
                    ?
                </span>

                <img
                    id="headerProfileImage"
                    alt="프로필 사진"
                    style="
                        display:none;
                        width:40px;
                        height:40px;
                        border-radius:50%;
                        object-fit:cover;
                    "
                >

            </a>

        </div>

    </div>

</header>


<main class="page-width">

    <div class="page-head">

        <div>

            <h1>
                내 프로필
            </h1>

            <p>
                내 계정과 운동 정보를 관리할 수 있습니다.
            </p>

        </div>

        <div
            style="
                display:flex;
                gap:10px;
            "
        >

            <button
                id="editButton"
                class="btn blue"
                type="button"
            >
                프로필 수정
            </button>

            <button
                id="logoutButton"
                class="btn"
                type="button"
            >
                로그아웃
            </button>

        </div>

    </div>


    <div class="profile-grid">

        <aside class="panel profile-summary">

            <span
                id="profileAvatar"
                class="avatar lg"
            >
                ?
            </span>

            <img
                id="profileImage"
                alt="프로필 사진"
                style="
                    display:none;
                    width:120px;
                    height:120px;
                    border-radius:50%;
                    object-fit:cover;
                    margin:auto;
                "
            >

            <h2 id="profileNickname">
                불러오는 중...
            </h2>

            <p
                id="profileRegion"
                class="subtle"
            >
                -
            </p>


            <div
                style="
                    margin-top:18px;
                    display:grid;
                    gap:10px;
                "
            >

                <input
                    id="profileImageInput"
                    type="file"
                    accept=".jpg,.jpeg,.png,.webp"
                >

                <button
                    id="uploadImageButton"
                    class="btn blue"
                    type="button"
                >
                    프로필 사진 변경
                </button>

            </div>

        </aside>


        <section
            style="
                display:grid;
                gap:14px;
            "
        >

            <div
                id="profileView"
                class="panel"
            >

                <h2>
                    계정 정보
                </h2>

                <div class="table-wrap">

                    <table class="participation-table">

                        <tbody>

                        <tr>
                            <th>아이디</th>
                            <td id="profileLoginId">-</td>
                        </tr>

                        <tr>
                            <th>닉네임</th>
                            <td id="profileNicknameInfo">-</td>
                        </tr>

                        <tr>
                            <th>이메일</th>
                            <td id="profileEmail">-</td>
                        </tr>

                        <tr>
                            <th>생년월일</th>
                            <td id="profileBirthDate">-</td>
                        </tr>

                        <tr>
                            <th>성별</th>
                            <td id="profileGender">-</td>
                        </tr>

                        <tr>
                            <th>활동 지역</th>
                            <td id="profileRegionInfo">-</td>
                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>


            <div
                id="profileEdit"
                class="panel"
                style="display:none"
            >

                <h2>
                    프로필 수정
                </h2>

                <div class="form-grid">

                    <div class="field">

                        <label for="editLoginId">
                            아이디
                        </label>

                        <input
                            id="editLoginId"
                            disabled
                        >

                    </div>

                    <div class="field">

                        <label for="editNickname">
                            닉네임
                        </label>

                        <input
                            id="editNickname"
                        >

                    </div>

                    <div class="field">

                        <label for="editEmail">
                            이메일
                        </label>

                        <input
                            id="editEmail"
                            type="email"
                        >

                    </div>

                    <div class="field">

                        <label for="editBirthDate">
                            생년월일
                        </label>

                        <input
                            id="editBirthDate"
                            type="date"
                        >

                    </div>

                    <div class="field">

                        <label for="editGender">
                            성별
                        </label>

                        <select id="editGender">

                            <option value="MALE">
                                남성
                            </option>

                            <option value="FEMALE">
                                여성
                            </option>

                        </select>

                    </div>

                    <div class="field">

                        <label for="editRegion">
                            활동 지역
                        </label>

                        <input
                            id="editRegion"
                        >

                    </div>

                </div>


                <div
                    style="
                        display:flex;
                        gap:10px;
                        margin-top:20px;
                    "
                >

                    <button
                        id="saveButton"
                        class="btn blue"
                        type="button"
                    >
                        저장
                    </button>

                    <button
                        id="cancelButton"
                        class="btn"
                        type="button"
                    >
                        취소
                    </button>

                </div>

            </div>


            <div class="panel">

                <h2>
                    운동 프로필
                </h2>

                <div
                    style="
                        display:flex;
                        gap:10px;
                        flex-wrap:wrap;
                        margin-bottom:18px;
                    "
                >

                    <select id="sportSelect">

                        <option value="">
                            종목 선택
                        </option>

                    </select>


                    <select id="skillSelect">

                        <option value="BRONZE">
                            BRONZE
                        </option>

                        <option value="SILVER">
                            SILVER
                        </option>

                        <option value="GOLD">
                            GOLD
                        </option>

                        <option value="MASTER">
                            MASTER
                        </option>

                    </select>


                    <button
                        id="addSportButton"
                        class="btn blue"
                        type="button"
                    >
                        종목 추가
                    </button>

                </div>


                <div id="mySportsList">

                    운동 정보를 불러오는 중...

                </div>

            </div>


            <div class="panel">

                <h2>
                    비밀번호 변경
                </h2>

                <p class="subtle">
                    현재 비밀번호를 확인한 뒤 새로운 비밀번호로 변경합니다.
                </p>

                <div
                    class="form-grid"
                    style="margin-top:18px"
                >

                    <div class="field">

                        <label for="currentPassword">
                            현재 비밀번호
                        </label>

                        <input
                            id="currentPassword"
                            type="password"
                            placeholder="현재 비밀번호"
                        >

                    </div>


                    <div class="field">

                        <label for="newPassword">
                            새 비밀번호
                        </label>

                        <input
                            id="newPassword"
                            type="password"
                            placeholder="8자 이상 입력"
                        >

                    </div>


                    <div class="field">

                        <label for="newPasswordCheck">
                            새 비밀번호 확인
                        </label>

                        <input
                            id="newPasswordCheck"
                            type="password"
                            placeholder="새 비밀번호 다시 입력"
                        >

                    </div>

                </div>


                <button
                    id="changePasswordButton"
                    class="btn blue"
                    type="button"
                    style="margin-top:18px"
                >
                    비밀번호 변경
                </button>

            </div>


            <div class="panel">

                <h2>
                    계정 관리
                </h2>

                <p class="subtle">
                    계정을 삭제하면 다시 로그인할 수 없습니다.
                </p>

                <button
                    id="deleteAccountButton"
                    class="btn"
                    type="button"
                    style="margin-top:12px"
                >
                    계정 삭제
                </button>

            </div>

        </section>

    </div>

</main>


<div
    id="toast"
    class="toast"
></div>


<script src="profile-api.js"></script>

</body>

</html>
