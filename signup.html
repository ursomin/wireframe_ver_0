<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>회원가입 | PLAYUPP</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<main class="auth-page">

    <section
        class="auth-card"
        style="width:min(620px,100%)"
    >

        <div class="auth-brand">
            PLAY<span>UPP</span>
        </div>

        <h1>회원가입</h1>

        <p>
            기본 정보를 입력하고 PLAYUPP를 시작하세요.
        </p>

        <div class="form-grid">

            <div class="field">

                <label for="signupLoginId">
                    아이디
                </label>

                <input
                    id="signupLoginId"
                    type="text"
                    placeholder="아이디 입력"
                >

            </div>


            <div class="field">

                <label for="signupNickname">
                    닉네임
                </label>

                <input
                    id="signupNickname"
                    type="text"
                    placeholder="서비스에 표시될 이름"
                >

            </div>


            <div class="field">

                <label for="signupPassword">
                    비밀번호
                </label>

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="8자 이상 입력"
                >

            </div>


            <div class="field">

                <label for="signupPasswordCheck">
                    비밀번호 확인
                </label>

                <input
                    id="signupPasswordCheck"
                    type="password"
                >

            </div>


            <div class="field">

                <label for="signupBirthDate">
                    생년월일
                </label>

                <input
                    id="signupBirthDate"
                    type="date"
                >

            </div>


            <div class="field">

                <label for="signupGender">
                    성별
                </label>

                <select id="signupGender">

                    <option value="">
                        선택
                    </option>

                    <option value="MALE">
                        남성
                    </option>

                    <option value="FEMALE">
                        여성
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="signupEmail">
                    이메일
                </label>

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="example@email.com"
                >

            </div>


            <div class="field full">

                <label for="signupRegion">
                    활동 지역
                </label>

                <input
                    id="signupRegion"
                    type="text"
                    placeholder="예: 인천광역시 연수구"
                >

            </div>

        </div>


        <div
            class="form-section"
            style="margin-top:22px"
        >

            <h2>약관 동의</h2>

            <div class="timeline">

                <label>

                    <input
                        class="requiredTerms"
                        type="checkbox"
                    >

                    [필수] 서비스 이용약관 동의

                </label>


                <label>

                    <input
                        class="requiredTerms"
                        type="checkbox"
                    >

                    [필수] 개인정보 수집 및 이용 동의

                </label>


                <label>

                    <input
                        class="requiredTerms"
                        type="checkbox"
                    >

                    [필수] 위치정보 수집 및 이용 동의

                </label>


                <label>

                    <input type="checkbox">

                    [선택] 이메일 광고성 정보 수신 동의

                </label>

            </div>

        </div>


        <button
            id="signupButton"
            class="btn blue block"
            type="button"
            style="margin-top:22px"
        >
            가입하기
        </button>


        <div class="terms">

            이미 계정이 있나요?

            <a
                href="login.html"
                style="color:#2563eb; font-weight:800"
            >
                로그인
            </a>

        </div>

    </section>

</main>


<div id="toast" class="toast"></div>

<script src="auth-api.js"></script>

</body>
</html>
