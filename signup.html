<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | PLAYUPP</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><section class="auth-card" style="width:min(620px,100%)"><div class="auth-brand">PLAY<span>UPP</span></div><h1>회원가입</h1><p>기본 정보를 입력하고 PLAYUPP를 시작하세요.</p><div class="form-grid">
