<!doctype html>
<html lang="ko">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        내 모임 | PLAYUPP
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <a
            class="brand"
            href="index.html"
        >
            <span class="brand-mark">
                PLAY<span>UPP</span>
            </span>
        </a>


        <nav class="main-nav">

            <a href="index.html">
                모임 찾기
            </a>

            <a href="create.html">
                모임 생성
            </a>

            <a href="my-meetings.html">
                내 모임
            </a>

        </nav>


        <div class="top-actions">

            <a href="chat.html">
                채팅
            </a>

            <a href="profile.html">
                내 프로필
            </a>

        </div>

    </div>

</header>


<main class="page-width">

    <div class="page-head">

        <div>

            <h1>
                내가 만든 모임
            </h1>

            <p>
                내가 생성한 모임을 확인하고 관리할 수 있습니다.
            </p>

        </div>


        <a
            href="create.html"
            class="btn blue"
        >
            + 모임 만들기
        </a>

    </div>


    <div
        id="myMeetingCount"
        class="subtle"
        style="margin-bottom:12px"
    >
    </div>


    <div
        id="myMeetingsList"
        style="
            display:grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px, 1fr)
                );
            gap:16px;
        "
    >

        <div class="panel">
            내가 만든 모임을 불러오는 중...
        </div>

    </div>

</main>


<div
    id="toast"
    class="toast"
></div>


<script src="my-meetings-api.js"></script>

</body>

</html>
