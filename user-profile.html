<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        사용자 프로필 | PLAYUPP
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <a
            class="brand"
            href="index.html"
        >
            <span class="brand-mark">
                PLAY<span>UPP</span>
            </span>
        </a>

        <nav class="main-nav">

            <a href="index.html">
                모임 찾기
            </a>

            <a href="create.html">
                모임 생성
            </a>

            <a href="my-meetings.html">
                내 모임
            </a>

        </nav>

        <div class="top-actions">

            <a href="chat.html">
                채팅
            </a>

            <a href="profile.html">
                내 프로필
            </a>

        </div>

    </div>

</header>


<main class="page-width">

    <div class="page-head">

        <div>

            <h1>
                사용자 프로필
            </h1>

            <p>
                다른 참가자의 프로필을 확인할 수 있습니다.
            </p>

        </div>

    </div>


    <div class="profile-grid">

        <aside class="panel profile-summary">

            <span
                id="userAvatar"
                class="avatar lg"
            >
                ?
            </span>

            <img
                id="userProfileImage"
                alt="프로필 사진"
                style="
                    display:none;
                    width:120px;
                    height:120px;
                    border-radius:50%;
                    object-fit:cover;
                    margin:auto;
                "
            >

            <h2 id="userNickname">
                불러오는 중...
            </h2>

            <p
                id="userRegion"
                class="subtle"
            >
                -
            </p>

        </aside>


        <section
            style="
                display:grid;
                gap:14px;
            "
        >

            <div class="panel">

                <h2>
                    기본 정보
                </h2>

                <div class="table-wrap">

                    <table class="participation-table">

                        <tbody>

                        <tr>
                            <th>
                                닉네임
                            </th>

                            <td id="userNicknameInfo">
                                -
                            </td>
                        </tr>

                        <tr>
                            <th>
                                활동 지역
                            </th>

                            <td id="userRegionInfo">
                                -
                            </td>
                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>


            <div class="panel">

                <h2>
                    운동 프로필
                </h2>

                <div id="sportsList">

                    아직 등록된 운동 정보가 없습니다.

                </div>

            </div>

        </section>

    </div>

</main>


<div
    id="toast"
    class="toast"
></div>


<script src="user-profile-api.js"></script>

</body>

</html>
