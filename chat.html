<!doctype html>

<html lang="ko">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        채팅 | PLAYUPP
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

<header class="topbar">

    <div class="topbar-inner">

        <a
            class="brand"
            href="index.html"
        >

            <span class="brand-mark">
                PLAY<span>UPP</span>
            </span>

        </a>


        <nav class="main-nav">

            <a href="index.html">
                모임 찾기
            </a>

            <a href="create.html">
                모임 생성
            </a>

            <a href="my-meetings.html">
                내 모임
            </a>

        </nav>


        <div class="top-actions">

            <a href="chat.html">
                채팅
            </a>

            <a href="profile.html">
                내 프로필
            </a>

        </div>

    </div>

</header>


<main class="page-width">

    <div class="page-head">

        <div>

            <h1>
                채팅
            </h1>

            <p>
                참여 중인 모임의 멤버들과 대화할 수 있습니다.
            </p>

        </div>

    </div>


    <div
        style="
            display:grid;
            grid-template-columns:
                260px minmax(0, 1fr) 220px;
            gap:16px;
        "
    >

        <!-- 채팅방 목록 -->
        <aside class="panel">

            <h2>
                채팅방
            </h2>


            <div
                id="chatRoomList"
                style="
                    display:grid;
                    gap:8px;
                    margin-top:16px;
                "
            >

                불러오는 중...

            </div>

        </aside>


        <!-- 채팅 -->
        <section
            class="panel"
            style="
                min-height:600px;
                display:flex;
                flex-direction:column;
            "
        >

            <div
                style="
                    border-bottom:
                        1px solid #ddd;
                    padding-bottom:14px;
                "
            >

                <h2 id="currentRoomTitle">
                    채팅방을 선택해주세요.
                </h2>

                <p
                    id="socketStatus"
                    class="subtle"
                    style="margin-top:4px"
                >
                    서버 연결 중...
                </p>

            </div>


            <div
                id="messageList"
                style="
                    flex:1;
                    overflow-y:auto;
                    padding:20px 0;
                    display:flex;
                    flex-direction:column;
                    gap:12px;
                    min-height:420px;
                    max-height:520px;
                "
            >

                <div class="subtle">
                    채팅방을 선택해주세요.
                </div>

            </div>


            <div
                style="
                    display:flex;
                    gap:10px;
                    border-top:
                        1px solid #ddd;
                    padding-top:16px;
                "
            >

                <input
                    id="messageInput"
                    type="text"
                    placeholder="메시지를 입력하세요."
                    style="
                        flex:1;
                    "
                    disabled
                >

                <button
                    id="sendMessageButton"
                    class="btn blue"
                    type="button"
                    disabled
                >
                    전송
                </button>

            </div>

        </section>


        <!-- 멤버 -->
        <aside class="panel">

            <h2>
                참여 멤버
            </h2>


            <div
                id="memberList"
                style="
                    display:grid;
                    gap:10px;
                    margin-top:16px;
                "
            >

                채팅방을 선택해주세요.

            </div>

        </aside>

    </div>

</main>


<div
    id="toast"
    class="toast"
></div>


<!-- Socket.IO 브라우저 라이브러리 -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script src="chat-api.js"></script>

</body>

</html>
