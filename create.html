<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        모임 생성 | PLAYUPP
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <a
            class="brand"
            href="index.html"
        >
            <span class="brand-mark">
                PLAY<span>UPP</span>
            </span>
        </a>

        <nav class="main-nav">

            <a href="index.html">
                모임 찾기
            </a>

            <a href="create.html">
                모임 생성
            </a>

            <a href="my-meetings.html">
                내 모임
            </a>

        </nav>

        <div class="top-actions">

            <a href="chat.html">
                채팅
            </a>

            <a href="profile.html">
                내 프로필
            </a>

        </div>

    </div>

</header>


<main class="page-width">

    <div class="page-head">

        <div>

            <h1>
                모임 생성
            </h1>

            <p>
                새로운 운동 모임을 만들어보세요.
            </p>

        </div>

    </div>


    <section
        class="panel"
        style="
            max-width:760px;
            margin:auto;
        "
    >

        <div class="form-grid">

            <div class="field full">

                <label for="meetingTitle">
                    모임 제목
                </label>

                <input
                    id="meetingTitle"
                    type="text"
                    placeholder="예: 주말 배드민턴 같이 하실 분"
                >

            </div>


            <div class="field">

                <label for="meetingSport">
                    운동 종목
                </label>

                <select id="meetingSport">

                    <option value="">
                        종목 선택
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="meetingDate">
                    모임 날짜
                </label>

                <input
                    id="meetingDate"
                    type="date"
                >

            </div>


            <div class="field">

                <label for="meetingLocation">
                    장소
                </label>

                <input
                    id="meetingLocation"
                    type="text"
                    placeholder="예: 인천 연수구 체육관"
                >

            </div>


            <div class="field">

                <label for="meetingMaxMembers">
                    모집 인원
                </label>

                <input
                    id="meetingMaxMembers"
                    type="number"
                    min="1"
                    placeholder="예: 8"
                >

            </div>


            <div class="field full">

                <label for="meetingDescription">
                    모임 설명
                </label>

                <textarea
                    id="meetingDescription"
                    rows="7"
                    placeholder="모임에 대한 설명을 입력해주세요."
                ></textarea>

            </div>

        </div>


        <div
            style="
                display:flex;
                gap:10px;
                margin-top:24px;
            "
        >

            <button
                id="createMeetingButton"
                class="btn blue"
                type="button"
            >
                모임 생성
            </button>

            <a
                href="index.html"
                class="btn"
            >
                취소
            </a>

        </div>

    </section>

</main>


<div
    id="toast"
    class="toast"
></div>


<script src="create-meeting-api.js"></script>

</body>

</html>
