<!doctype html>
<html lang="ko">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        모임 상세 | PLAYUPP
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <a
            class="brand"
            href="index.html"
        >
            <span class="brand-mark">
                PLAY<span>UPP</span>
            </span>
        </a>

        <nav class="main-nav">

            <a href="index.html">
                모임 찾기
            </a>

            <a href="create.html">
                모임 생성
            </a>

            <a href="my-meetings.html">
                내 모임
            </a>

        </nav>

        <div class="top-actions">

            <a href="chat.html">
                채팅
            </a>

            <a href="profile.html">
                내 프로필
            </a>

        </div>

    </div>

</header>


<main class="page-width">

    <div class="page-head">

        <div>

            <h1 id="meetingTitle">
                모임 정보를 불러오는 중...
            </h1>

            <p id="meetingSport">
                -
            </p>

        </div>

        <a
            href="index.html"
            class="btn"
        >
            목록으로
        </a>

    </div>


    <section
        id="meetingView"
        class="panel"
    >

        <div class="table-wrap">

            <table class="participation-table">

                <tbody>

                <tr>
                    <th>운동 종목</th>
                    <td id="detailSport">-</td>
                </tr>

                <tr>
                    <th>모임장</th>
                    <td id="detailHost">-</td>
                </tr>

                <tr>
                    <th>날짜</th>
                    <td id="detailDate">-</td>
                </tr>

                <tr>
                    <th>장소</th>
                    <td id="detailLocation">-</td>
                </tr>

                <tr>
                    <th>모집 인원</th>
                    <td id="detailMaxMembers">-</td>
                </tr>

                <tr>
                    <th>참여 방식</th>
                    <td id="detailApprovalType">-</td>
                </tr>

                <tr>
                    <th>상태</th>
                    <td id="detailStatus">-</td>
                </tr>

                </tbody>

            </table>

        </div>


        <div
            style="margin-top:24px"
        >

            <h2>
                모임 설명
            </h2>

            <p
                id="detailDescription"
                style="
                    margin-top:12px;
                    white-space:pre-wrap;
                "
            >
                -
            </p>

        </div>


        <div
            style="
                display:flex;
                gap:10px;
                margin-top:28px;
                flex-wrap:wrap;
            "
        >

            <button
                id="joinMeetingButton"
                class="btn blue"
                type="button"
            >
                참여 신청
            </button>

            <button
                id="cancelParticipationButton"
                class="btn"
                type="button"
            >
                참여 취소
            </button>

            <button
                id="editMeetingButton"
                class="btn"
                type="button"
            >
                모임 수정
            </button>

            <button
                id="deleteMeetingButton"
                class="btn"
                type="button"
            >
                모임 삭제
            </button>

        </div>

    </section>


    <section
        id="meetingEdit"
        class="panel"
        style="
            display:none;
            margin-top:18px;
        "
    >

        <h2>
            모임 수정
        </h2>


        <div
            class="form-grid"
            style="margin-top:18px"
        >

            <div class="field full">

                <label for="editMeetingTitle">
                    모임 제목
                </label>

                <input
                    id="editMeetingTitle"
                    type="text"
                >

            </div>


            <div class="field">

                <label for="editMeetingSport">
                    운동 종목
                </label>

                <select id="editMeetingSport">

                    <option value="">
                        종목 선택
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="editMeetingDate">
                    날짜
                </label>

                <input
                    id="editMeetingDate"
                    type="date"
                >

            </div>


            <div class="field">

                <label for="editMeetingLocation">
                    장소
                </label>

                <input
                    id="editMeetingLocation"
                    type="text"
                >

            </div>


            <div class="field">

                <label for="editMeetingMaxMembers">
                    모집 인원
                </label>

                <input
                    id="editMeetingMaxMembers"
                    type="number"
                    min="1"
                >

            </div>


            <div class="field full">

                <label for="editMeetingDescription">
                    모임 설명
                </label>

                <textarea
                    id="editMeetingDescription"
                    rows="7"
                ></textarea>

            </div>

        </div>


        <div
            style="
                display:flex;
                gap:10px;
                margin-top:22px;
            "
        >

            <button
                id="saveMeetingButton"
                class="btn blue"
                type="button"
            >
                수정 저장
            </button>

            <button
                id="cancelMeetingButton"
                class="btn"
                type="button"
            >
                취소
            </button>

        </div>

    </section>


    <section
        id="hostManagement"
        class="panel"
        style="
            display:none;
            margin-top:18px;
        "
    >

        <h2>
            모임장 참여자 관리
        </h2>

        <p
            class="subtle"
            style="margin-top:6px"
        >
            참여 신청 승인/거절, 출석 처리, 강퇴를 할 수 있습니다.
        </p>


        <div
            style="margin-top:24px"
        >

            <h3>
                승인 대기 신청자
            </h3>

            <div
                id="pendingParticipants"
                style="
                    display:grid;
                    gap:10px;
                    margin-top:12px;
                "
            >
                불러오는 중...
            </div>

        </div>


        <div
            style="margin-top:28px"
        >

            <h3>
                현재 참여자
            </h3>

            <div
                id="approvedParticipants"
                style="
                    display:grid;
                    gap:10px;
                    margin-top:12px;
                "
            >
                불러오는 중...
            </div>

        </div>

    </section>

</main>


<div
    id="toast"
    class="toast"
></div>


<script src="meeting-detail-api.js"></script>

</body>

</html>
